name: Build & Lint
on: [push]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Project settings. To reuse this workflow in another decoupled site, copy it along with `scripts/` and the
# `validate:html` and `validate:a11y` package.json scripts, then update these values.
env:
  # Drupal codebase the frontend builds against.
  DRUPAL_REPO: SU-SWS/ace-stanfordlagunita
  DRUPAL_REF: 4.x
  # 'true' builds against the Drupal branch with the same name as this branch when one exists, otherwise DRUPAL_REF.
  # `N.x` branches always use DRUPAL_REF, since both repositories use those names for unrelated major versions.
  DRUPAL_MATCH_BRANCH: 'false'
  # Directory in docroot/sites. Also the `--site` option for drush drupal:sync and drupal:install.
  DRUPAL_SITE: default
  # Where the database comes from when there's no cached copy: "sync" copies production over SSH (needs the SSH_KEY and
  # KNOWN_HOSTS secrets), "install" does a fresh `drush drupal:install`.
  DRUPAL_DB_SOURCE: install
  # How long a cached database is reused, as a `date` format: `%F` is daily, `%G-W%V` is weekly.
  DRUPAL_DB_CACHE_PERIOD: '%F'
  # SQL to run after the database is ready, ie to blank out third party keys. Leave empty for none.
  DRUPAL_CI_SQL: 'truncate config_pages__su_site_algolia_id'
  # Drush command that prints the .env lines the frontend needs to connect to Drupal.
  DRUPAL_NEXT_CONNECT: stanford-decoupled:connect-next
  # Number of pages `next build` prerenders, and so how many pages the HTML and accessibility checks cover.
  BUILD_PAGES: 100
  NODE_VERSION: 24
  # Anything else this project's build needs, ie API keys from secrets.

jobs:
  lint:
    name: Lint & TS Check
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_DRUPAL_BASE_URL: http://localhost
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Restore and save are separate steps so the install is cached even when lint fails.
      - name: Restore node_modules
        id: modules-cache
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: lint-modules-${{ env.NODE_VERSION }}-${{ hashFiles('yarn.lock') }}
      - name: Install
        run: |
          yarn
          yarn next telemetry disable
      - name: Save node_modules
        if: steps.modules-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: node_modules
          key: lint-modules-${{ env.NODE_VERSION }}-${{ hashFiles('yarn.lock') }}
      - name: Lint
        run: yarn lint
  build:
    name: Build
    runs-on: ubuntu-latest
    container:
      image: pookmish/drupal8ci:php8.4
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: drupal
          MYSQL_USER: drupal
          MYSQL_PASSWORD: drupal
          MYSQL_ROOT_PASSWORD: drupal
        ports:
          - 33306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
      chrome:
        image: selenium/standalone-chrome:130.0
        options: --shm-size=2g
    steps:
      - name: Install SSH key
        if: env.DRUPAL_DB_SOURCE == 'sync'
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_KEY }}
          name: id_rsa
          known_hosts: ${{ secrets.KNOWN_HOSTS }}
          if_key_exists: fail
      - name: Find Drupal Branch
        id: drupal-branch
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          REF=$DRUPAL_REF
          if [ "$DRUPAL_MATCH_BRANCH" = "true" ] && ! echo "$BRANCH" | grep -qE '^[0-9]+\.x$' &&
            git ls-remote --exit-code --heads "https://github.com/$DRUPAL_REPO.git" "$BRANCH" > /dev/null 2>&1; then
            REF="$BRANCH"
          fi
          echo "Building against $DRUPAL_REPO $REF"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.DRUPAL_REPO }}
          ref: ${{ steps.drupal-branch.outputs.ref }}
      - uses: actions/checkout@v7
        with:
          path: frontend
      # Every cache below is restored and saved in separate steps, so a failing HTML or accessibility check later in the
      # job doesn't stop them from being saved.
      - name: Restore Composer Cache
        id: composer-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            vendor
            docroot/core
            docroot/libraries
            docroot/modules/contrib
          key: composer-${{ hashFiles('drush/drush.yml') }}-${{ hashFiles('composer.json') }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ hashFiles('drush/drush.yml') }}-${{ hashFiles('composer.json') }}-
            composer-${{ hashFiles('drush/drush.yml') }}-
      - name: Database Cache Key
        id: db-key
        env:
          DRUPAL_BRANCH: ${{ steps.drupal-branch.outputs.ref }}
        # Keyed by Drupal branch too: a dump made on another branch already has that branch's updates applied.
        run: echo "key=db-${DRUPAL_SITE}-${DRUPAL_DB_SOURCE}-${DRUPAL_BRANCH}-$(date -u +"$DRUPAL_DB_CACHE_PERIOD")" >> "$GITHUB_OUTPUT"
      # A sanitized copy of the database, reused for DRUPAL_DB_CACHE_PERIOD. Copying it from Acquia is the slowest part of
      # the job. To force a fresh copy sooner, delete the cache with `gh cache delete <key>`; the key is in this step's log.
      - name: Restore Database Cache
        id: db-cache
        uses: actions/cache/restore@v6
        with:
          path: db/${{ env.DRUPAL_SITE }}.sql.gz
          key: ${{ steps.db-key.outputs.key }}
      # In CI every site in docroot/sites shares the one `drupal` database, so `--uri` only picks the site's settings and
      # config directory.
      - name: Set Up Drupal
        run: |
          DB_DUMP=$GITHUB_WORKSPACE/db/$DRUPAL_SITE.sql &&
          git config --system --add safe.directory '*' &&
          printf '[client]\nskip-ssl-verify-server-cert\n' > /etc/mysql/conf.d/ci.cnf &&
          mysql -h mysql -P 3306 -u root -pdrupal -e 'SET GLOBAL max_allowed_packet=67108864;' &&
          rm -rf /var/www/html &&
          ln -snf $GITHUB_WORKSPACE /var/www/html &&
          mkdir -p docroot/sites/default/files &&
          chmod -R 777 docroot/sites/default/files/ &&
          if [ "$DRUPAL_SITE" != "default" ]; then
            rm -rf docroot/sites/$DRUPAL_SITE/files &&
            ln -sL ../default/files/ docroot/sites/$DRUPAL_SITE/files
          fi &&
          apachectl stop && apachectl start &&
          composer install -n &&
          if [ -f $DB_DUMP.gz ]; then
            drush --uri=$DRUPAL_SITE sql:drop -y &&
            gunzip -c $DB_DUMP.gz | drush --uri=$DRUPAL_SITE sql:cli &&
            # The Drupal code may have changed since the dump was made.
            drush --uri=$DRUPAL_SITE deploy -y
          else
            drush drupal:$DRUPAL_DB_SOURCE --site=$DRUPAL_SITE -n &&
            mkdir -p db &&
            drush --uri=$DRUPAL_SITE sql:dump --gzip --result-file=$DB_DUMP &&
            ls -lh $DB_DUMP.gz
          fi &&
          if [ -n "$DRUPAL_CI_SQL" ]; then
            drush --uri=$DRUPAL_SITE sqlq "$DRUPAL_CI_SQL"
          fi &&
          # Warm Drupal's caches before the frontend build's first GraphQL requests.
          curl --silent --output /dev/null http://localhost
      - name: Save Composer Cache
        if: steps.composer-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            vendor
            docroot/core
            docroot/libraries
            docroot/modules/contrib
          key: composer-${{ hashFiles('drush/drush.yml') }}-${{ hashFiles('composer.json') }}-${{ hashFiles('composer.lock') }}
      - name: Save Database Cache
        if: steps.db-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: db/${{ env.DRUPAL_SITE }}.sql.gz
          key: ${{ steps.db-key.outputs.key }}
      - name: Restore node_modules
        id: modules-cache
        uses: actions/cache/restore@v6
        with:
          path: frontend/node_modules
          key: build-modules-${{ hashFiles('frontend/yarn.lock') }}
      # Turbopack's compile cache. Only this part of `.next/cache` is kept: the fetch cache would serve old GraphQL
      # responses and hide problems with the current Drupal data.
      - name: Restore Turbopack Cache
        uses: actions/cache/restore@v6
        with:
          path: frontend/.next/cache/turbopack
          key: turbopack-${{ hashFiles('frontend/yarn.lock') }}-${{ github.sha }}
          restore-keys: |
            turbopack-${{ hashFiles('frontend/yarn.lock') }}-
            turbopack-
      - name: Build Frontend
        id: build
        run: |
          cd $GITHUB_WORKSPACE/frontend &&
          cp .env.example .env.local &&
          sed -i -r "s|NEXT_PUBLIC_DRUPAL_BASE_URL.*|NEXT_PUBLIC_DRUPAL_BASE_URL=http://localhost|g" .env.local &&
          cd $GITHUB_WORKSPACE &&
          drush $DRUPAL_NEXT_CONNECT >> $GITHUB_WORKSPACE/frontend/.env.local &&
          cd $GITHUB_WORKSPACE/frontend &&
          yarn &&
          yarn build
      - name: Save node_modules
        if: steps.modules-cache.outputs.cache-hit != 'true' && steps.build.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: frontend/node_modules
          key: build-modules-${{ hashFiles('frontend/yarn.lock') }}
      - name: Save Turbopack Cache
        if: steps.build.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: frontend/.next/cache/turbopack
          key: turbopack-${{ hashFiles('frontend/yarn.lock') }}-${{ github.sha }}
      # html-validate needs a newer node than the drupal8ci image ships.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Validate HTML
        run: |
          cd $GITHUB_WORKSPACE/frontend &&
          yarn validate:html
      # Chrome runs in the selenium service container, so it reaches the Next server by this container's IP rather than
      # localhost. Next has to listen on all interfaces for that to work.
      - name: Accessibility
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          cd $GITHUB_WORKSPACE/frontend &&
          (yarn start -H 0.0.0.0 -p 3000 > next-start.log 2>&1 &) &&
          A11Y_BASE_URL=http://$(hostname -i | awk '{print $1}'):3000 SELENIUM_URL=http://chrome:4444 yarn validate:a11y
      - name: Upload Accessibility Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-report
          path: |
            frontend/a11y-report.json
            frontend/next-start.log
          if-no-files-found: ignore
