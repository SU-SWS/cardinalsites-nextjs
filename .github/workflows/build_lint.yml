
name: Build & Lint
on: [push]
jobs:
  lint:
    name: Lint & TS Check
    runs-on: ubuntu-latest
    container:
      image: node:24
      env:
        NEXT_PUBLIC_DRUPAL_BASE_URL: http://localhost
    steps:
      - uses: actions/checkout@v7
      - name: Restore Cache
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            .next
          key: lint-${{ hashFiles('package.json') }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            lint-${{ hashFiles('package.json') }}-${{ hashFiles('yarn.lock') }}
            lint-${{ hashFiles('package.json') }}-
      - name: Lint
        run: |
          yarn
          yarn next telemetry disable
          yarn lint
  build:
    name: Build
    runs-on: ubuntu-latest
    container:
      image: pookmish/drupal8ci:php8.4
      env:
        BUILD_PAGES: 100
        SITENAME: sitedir
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: drupal
          MYSQL_USER: drupal
          MYSQL_PASSWORD: drupal
          MYSQL_ROOT_PASSWORD: drupal
        ports:
          - 33306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
      chrome:
        image: selenium/standalone-chrome:130.0
        options: --shm-size=2g
    steps:
      - uses: actions/checkout@v7
        with:
          repository: "SU-SWS/ace-stanfordlagunita"
      - uses: actions/checkout@v7
        with:
          path: frontend
      - name: Restore Cache
        uses: actions/cache@v5
        with:
          path: |
            vendor
            docroot/core
            docroot/libraries
            docroot/modules/contrib
            frontend/node_modules
          key: build-${{ hashFiles('drush/drush.yml') }}-${{ hashFiles('composer.json') }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            build-${{ hashFiles('drush/drush.yml') }}-${{ hashFiles('composer.json') }}-${{ hashFiles('composer.lock') }}
            build-${{ hashFiles('drush/drush.yml') }}-${{ hashFiles('composer.json') }}-
            build-${{ hashFiles('drush/drush.yml') }}-
      - name: Sync Site
        run: |
          git config --system --add safe.directory '*' &&
          printf '[client]\nskip-ssl-verify-server-cert\n' > /etc/mysql/conf.d/ci.cnf &&
          mysql -h mysql -P 3306 -u root -pdrupal -e 'SET GLOBAL max_allowed_packet=67108864;' &&
          rm -rf /var/www/html &&
          ln -snf $GITHUB_WORKSPACE /var/www/html &&
          mkdir -p docroot/sites/default/files &&
          chmod -R 777 docroot/sites/default/files/ &&
          apachectl stop && apachectl start &&
          composer install -n &&
          drush drupal:install -n &&
          drush sqlq 'truncate config_pages__su_site_algolia_id'
      - name: Build Frontend
        id: build
        run: |
          cd $GITHUB_WORKSPACE/frontend &&
          cp .env.example .env.local &&
          sed -i -r "s|NEXT_PUBLIC_DRUPAL_BASE_URL.*|NEXT_PUBLIC_DRUPAL_BASE_URL=http://localhost|g" .env.local &&
          sed -i -r 's/BUILD_PAGES=.*/BUILD_PAGES=-1/g' .env.local &&
          cd $GITHUB_WORKSPACE &&
          drush stanford-decoupled:connect-next >> $GITHUB_WORKSPACE/frontend/.env.local &&
          cd $GITHUB_WORKSPACE/frontend &&
          yarn &&
          yarn build
      # html-validate needs a newer node than the drupal8ci image ships.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Validate HTML
        run: |
          cd $GITHUB_WORKSPACE/frontend &&
          yarn validate:html
      # Chrome runs in the selenium service container, so it reaches the Next server by this container's IP rather than
      # localhost. Next has to listen on all interfaces for that to work.
      - name: Accessibility
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          cd $GITHUB_WORKSPACE/frontend &&
          (yarn start -H 0.0.0.0 -p 3000 > next-start.log 2>&1 &) &&
          A11Y_BASE_URL=http://$(hostname -i | awk '{print $1}'):3000 SELENIUM_URL=http://chrome:4444 yarn validate:a11y
      - name: Upload Accessibility Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-report
          path: |
            frontend/a11y-report.json
            frontend/next-start.log
          if-no-files-found: ignore
